[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "georefine-context-fast-runtime"
version = "0.1.1+cu129"
description = "Pinned Context and FastDecoder serving runtime"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "torch==2.9.1+cu129",
  "torchvision==0.24.1+cu129",
  "transformers==5.5.0",
  "jinja2>=3.1.0",
  "safetensors>=0.4",
  "numpy>=1.26",
  "accelerate>=1.10",
  "fastapi>=0.100",
  "uvicorn>=0.27",
  "Pillow>=10",
  "av>=15",
  "ninja>=1.11",
]

[project.optional-dependencies]
cuda = ["triton>=3.4,<4"]

[project.scripts]
"glc-loader" = "glc_loader.__main__:main"
"glc-serve" = "glc_serve.server:main"
"georefine-context-package" = "georefine_context_runtime.bitexact_context_package:main"
"georefine-predictive-package" = "georefine_context_runtime.bitexact_predictive_package:main"
"georefine-typed-context-package" = "georefine_context_runtime.typed_context_package:main"
"georefine-context-serve" = "georefine_context_runtime.serve_bitexact_context:main"
"georefine-predictive-serve" = "georefine_context_runtime.serve_bitexact_predictive:main"
"georefine-context-mlx-serve" = "glc_serve.mlx_server:main"
"georefine-context-fast-serve" = "glc_serve.context_fast_server:main"
"georefine-context-batch-serve" = "glc_serve.context_batch_server:main"
"georefine-context-optimised-serve" = "glc_serve.context_batch_server:optimised_main"
"georefine-context-build-kernels" = "glc_serve.kernel_cache:main"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["glc_loader", "glc_loader.*", "glc_serve", "glc_serve.*",
           "georefine_context_runtime", "georefine_context_runtime.*"]
namespaces = false

[tool.setuptools.package-data]
"georefine_context_runtime" = ["metal_steel_0304/*.h", "metal_steel_0304/LICENSE", "metal_steel_0304/SOURCE.json", "context_exponent_native.cpp", "context_exponent_native.py", "context_exponent_gemm.cpp", "context_exponent_gemm.cu", "context_exponent_gemm.py", "context_exponent_packet.cuh", "context_exponent_packet.py", "context_exponent_tables.py", "SOURCE_MANIFEST.json", "__init__.py", "context_alias_ans_native.cpp", "context_alias_packet.cuh", "context_alias_gemm.cpp", "context_alias_gemm.cu", "context_stream_packet.cuh", "context_stream_gemm.cpp", "context_stream_gemm.cu", "context_fused_gemm.cpp", "context_fused_gemm.cu", "context_fused_gemm.cuh", "context_tiled_packet.cpp", "context_tiled_packet.cu", "context_tiled_packet.cuh", "context_interleaved_packet.cpp", "context_interleaved_packet.cu", "context_interleaved_packet.cuh", "bitexact_context_ans.cpp", "bitexact_context_codec.py", "bitexact_context_gpu.py", "bitexact_context_gpu_index.cpp", "bitexact_context_gpu_kernels.py", "bitexact_context_mtp.py", "bitexact_context_package.py", "bitexact_context_serving.py", "bitexact_predictive_ans.cpp", "bitexact_predictive_codec.py", "bitexact_predictive_gpu.py", "bitexact_predictive_gpu_index.cpp", "bitexact_predictive_gpu_kernels.py", "bitexact_predictive_mix.py", "bitexact_predictive_package.py", "bitexact_predictive_serving.py", "licenses/CONTEXT_RELEASE_GRANT.json", "licenses/NATIVE_CODEC_LICENSE.txt", "licenses/PUBLIC_RUNTIME_LICENSE.txt", "licenses/PUBLIC_RUNTIME_NOTICE.txt", "serve_bitexact_context.py", "serve_bitexact_predictive.py"]
